<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Communication Aid Device</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header -->
     <header class="app-header">
      <!-- The current student's profile and name remain visible at the top. -->
      <div class="student-summary">
        <div class="student-profile">
          <img
            id="studentImage"
            src="images/boy.jpg"
            alt="Boy student"
          />
        </div>

        <h2 id="welcomeMessage">Hello Alex, Welcome</h2>
      </div>

      <!-- Language and student version buttons -->
      <div class="header-buttons">
        <button id="languageButton" class="language-button">
          FI/EN
        </button>

        <div class="student-selector"> <!--added gender instead of 2 girl boy buttons-->
          <button id="genderButton" class="student-option">
              👦 Boy
          </button>
        </div>
      </div>
    </header>

      <!-- Student Screen -->
    <main class="student-screen">

   

      <!-- Instruction -->
      <p class="instruction">What do you want?</p>


      <!-- Communication Buttons -->
      <section class="needs-grid">

        <!-- Water -->
        <button
          class="need-button tile-water"
          data-message="Water"
        >
          <img
            class="tile-image"
            src="images/Water.png"
            alt="Water"
          />
          <span class="tile-label"></span>
        </button>


        <!-- Food -->
        <button
          class="need-button tile-food"
          data-message="Food"
        >
          <img
            class="tile-image"
            src="images/food.png"
            alt="Food"
          />
          <span class="tile-label"></span>
        </button>


        <!-- Toilet -->
        <button
          class="need-button tile-toilet"
          data-message="Toilet"
        >
          <img
            class="tile-image"
            src="images/toilet.png"
            alt="Toilet"
          />
          <span class="tile-label"></span>
        </button>


        <!-- Tired -->
        <button
          class="need-button tile-tired"
          data-message="Tired"
        >
          <img
            id="tiredImage"
            class="tile-image"
            src="images/tired.png"
            alt="Tired"
          />
          <span class="tile-label"></span>
        </button>


        <!-- Angry -->
        <button
          class="need-button tile-angry"
          data-message="Angry"
        >
          <img
            id="angryImage"
            class="tile-image"
            src="images/angry.png"
            alt="Angry"
          />
          <span class="tile-label"></span>
        </button>


        <!-- Sleep -->
        <!--
        <button
          class="need-button tile-sleep"
          data-message="Sleep"
        >
          <img
            class="tile-image"
            src="images/sleep.png"
            alt="Sleep"
          />
          <span class="tile-label"></span>
        </button>
        -->

      </section>


      <!-- Selected Message -->
      <section class="message-area">

        <h2>Your message</h2>

        <p id="selectedMessage">
          Tap an icon above to select
        </p>

        <button
          id="sendButton"
          class="send-button"
        >
          Send to Teacher
        </button>

      </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

  </body>
</html>
